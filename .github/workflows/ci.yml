name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest ruff

      - name: Lint (undefined names, unused imports, syntax)
        run: ruff check --select F,E9 --exclude tools .

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests -q -rfE --tb=short 2>&1 | tee pytest.log

      - name: Report test failures
        if: failure()
        run: |
          # 把失败用例和断言写成注解与 Job Summary，便于不打开完整日志也能定位
          grep -E '^(FAILED|ERROR) ' pytest.log | head -10 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
          {
            echo '### pytest failures'
            echo '```'
            grep -E '^(FAILED|ERROR) |^E   |^tests/.*:[0-9]+: ' pytest.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Python syntax check
        run: python -m py_compile *.py scripts/*.py scripts/golden/*.py

      - name: JavaScript syntax check
        run: node --check static/app.js

  golden:
    # 安卓本机模式的 Kotlin 移植以 Python 为准：检查 Python 规则改了而金标语料没重新导出。
    # 金标由 Python 3.13 生成，不同版本的 Unicode 数据库不同，只在 3.13 上检查。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Golden fixtures match the Python implementation
        run: python scripts/golden/check_all.py

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, guard, lint and screenshot verify
        run: ./gradlew --no-daemon :core:test :app:swissGuard :app:swissGuardSelfTest :app:testDebugUnitTest :app:verifyRoborazziDebug :app:lintDebug :app:assembleDebug :app:assembleRelease

