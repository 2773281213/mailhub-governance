server {
    listen 80;
    listen [::]:80;
    server_name __MAILHUB_DOMAIN__;   # deploy/install.sh 会替换为实际域名

    # 管理密码和会话 cookie 只走 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __MAILHUB_DOMAIN__;   # deploy/install.sh 会替换为实际域名

    ssl_certificate /etc/nginx/ssl/mailhub-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/mailhub-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # OAuth 回调的查询串里有 state，网易隐式流程还可能带令牌：所有品牌的回调都不写访问日志。
    location ~ ^/api/oauth/[^/]+/(callback|fragment)$ {
        access_log off;
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
