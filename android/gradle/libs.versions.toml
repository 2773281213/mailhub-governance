[versions]
# 版本依据（2026-10 查证）：
# - AGP：developer.android.com/build/releases/past-releases/agp-9-0-0-release-notes 的兼容表
#   写明 AGP 9.0 最低 Gradle 9.1.0；AGP 9.1 要求 Gradle 9.3.1、9.2 要求 9.4.1、
#   9.3 要求 9.5.0、9.4 要求 9.6.0。本项目固定 Gradle 9.1.0，所以取兼容的最新稳定版 9.0.1。
# - Kotlin：Maven Central 的 kotlin-gradle-plugin maven-metadata 里最新的稳定 2.x（无 -RC/-Beta）。
# - Compose BOM / core-ktx / activity-compose：最新稳定版（BOM 2026.09.00、core-ktx 1.19.1、
#   activity-compose 1.13.0）的 AAR 元数据要求 compileSdk 37 和 AGP 9.1.0，与本卡固定的
#   compileSdk 36 + Gradle 9.1.0 冲突，所以取仍支持 compileSdk 36 的最新稳定版：
#   BOM 2026.06.01（compose.ui 1.11.4，minCompileSdk=35）、core-ktx 1.18.0（minCompileSdk=36）、
#   activity-compose 1.12.4（minCompileSdk=36）。
# - Robolectric 4.17：Maven Central maven-metadata 里的最新稳定版；4.17 的 release notes 明确
#   支持 SDK 36（"Run preinstrumented with SDK 36 on CI"），pom 只依赖 androidx.test:monitor:1.8.0
#   （该 AAR 没有 aar-metadata.properties，不限制 compileSdk）。
# - Roborazzi 1.77.0：Maven Central maven-metadata 里的最新稳定版；roborazzi 和 roborazzi-compose
#   两个 AAR 的 META-INF/com/android/build/gradle/aar-metadata.properties 都是
#   minCompileSdk=1、minAndroidGradlePluginVersion=1.0.0，对 compileSdk 36 / AGP 9.0.1 没有限制。
# - T08 网络层（Maven Central 最新稳定版，2026-10 查证）：
#   retrofit 3.0.0 / converter-kotlinx-serialization 3.0.0、okhttp 5.4.0 / mockwebserver 5.4.0、
#   kotlinx-serialization-json 1.12.0、kotlinx-coroutines 1.11.0。
#   retrofit 是 jar，依赖 okhttp 4.12.0，这里显式升到 5.x（okhttp 5 与 retrofit 3 兼容）。
#   okhttp 最新稳定版是 5.5.1，但它的 okhttp-android AAR 要求 compileSdk 37，所以退到 5.4.0
#   （okhttp-android 5.4.0 的 aar-metadata 是 minCompileSdk=36）。mockwebserver 与 okhttp 同版本。
#   mockwebserver 5.4.0 依赖 mockwebserver3，测试里直接用 mockwebserver3 API。
# - datastore-preferences 1.3.0（AAR 没有 aar-metadata.properties，不限制 compileSdk）。
# - lifecycle 最新稳定版是 2.11.0，但 lifecycle-runtime-compose-android / lifecycle-viewmodel-compose-android
#   2.11.0 的 aar-metadata 要求 compileSdk 37 + AGP 9.1.0，所以退到 2.10.0（minCompileSdk=35、
#   minAndroidGradlePluginVersion=8.6.0）。
# - L1 本机模式依赖（2026-11-07 查证）：
#   - androidx.sqlite:sqlite 与 androidx.sqlite:sqlite-bundled：Google Maven 的
#     androidx/sqlite/sqlite-bundled/maven-metadata.xml 里最新稳定版是 2.7.1
#     （更新的 2.8.0-alpha03 是 alpha，排除）。两个 AAR 打开后
#     META-INF/com/android/build/gradle/aar-metadata.properties 都是 minCompileSdk=34、
#     minAndroidGradlePluginVersion=8.1.1，与 compileSdk 36 + AGP 9.0.1 兼容。
#     -jvm 变体的 jar 里有 natives/windows_x64/sqliteJni.dll（另有 linux_x64、linux_arm64、
#     osx_arm64），本机 Windows 上跑单元测试不需要额外安装 SQLite。
#   - L1b 设备测试用的 instrumented 运行时（2026-11-07 查证）：
#     - androidx.test:runner：Google Maven 的 androidx/test/runner/maven-metadata.xml 里
#       最新版本是 1.8.0-alpha03（alpha，排除），最新稳定版是 1.7.0。runner-1.7.0.aar 里
#       没有 META-INF/com/android/build/gradle/aar-metadata.properties，不限制 compileSdk
#       与 AGP 版本；AAR 的 AndroidManifest 里 minSdkVersion=21，与本项目 minSdk 26 兼容。
#     - androidx.test.ext:junit：androidx/test/ext/junit/maven-metadata.xml 里最新版本是
#       1.4.0-alpha03（alpha，排除），最新稳定版是 1.3.0。junit-1.3.0.aar 同样没有
#       aar-metadata.properties，minSdkVersion=21。
#     - 两者的传递依赖 androidx.test:monitor 1.8.0、androidx.test.services:storage 1.6.0、
#       androidx.test:core 1.7.0 的 AAR 也都没有 aar-metadata.properties；这条依赖链上唯一
#       带编译约束的是 androidx.tracing:tracing 1.1.0（minCompileSdk=31、
#       minAndroidGradlePluginVersion=1.0.0），与 compileSdk 36 + AGP 9.0.1 兼容。
#   - angus-mail：Maven Central 的 org/eclipse/angus/angus-mail/maven-metadata.xml 里
#     最新稳定版是 2.0.5（2.1.0-M1 是 milestone，排除）。angus-mail 2.0.5 的父 pom
#     org.eclipse.angus:all:2.0.5 声明 mail-api.version=2.1.5、activation-api.version=2.1.4、
#     angus.activation.version=2.0.3，所以 jakarta.mail:jakarta.mail-api 取 2.1.5、
#     org.eclipse.angus:angus-activation 取 2.0.3，保证三者互相匹配。
#   - L7 测试用的本地 IMAP 服务器（2026-11-09 查证）：Maven Central 的
#     com/icegreen/greenmail/maven-metadata.xml 里 latest 与 release 都是 2.1.15
#     （2.1.0-alpha-*、2.1.0-rc-1 都已排除，最新版本就是它）。greenmail 2.1.15 的
#     pom 声明依赖 jakarta.mail:jakarta.mail-api 2.1.5、org.eclipse.angus:jakarta.mail 2.0.5、
#     jakarta.activation:jakarta.activation-api 2.1.4、org.eclipse.angus:angus-activation 2.0.3、
#     slf4j-api 1.7.36，与本目录已有的 jakartaMail/angusMail/angusActivation 完全对得上，
#     所以不需要额外升版本。注意 org.eclipse.angus:jakarta.mail 2.0.5 是**含 jakarta.mail-api
#     类**的胖 jar（452 个条目里带 jakarta/mail/*.class），会和本模块的 jakarta.mail-api 打架，
#     引用它时要把这个坐标排除掉（见 core/build.gradle.kts 的 testImplementation）。
agp = "9.0.1"
kotlin = "2.4.21"
composeBom = "2026.06.01"
activityCompose = "1.12.4"
coreKtx = "1.18.0"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.77.0"
retrofit = "3.0.0"
okhttp = "5.4.0"
kotlinxSerialization = "1.12.0"
kotlinxCoroutines = "1.11.0"
datastore = "1.3.0"
lifecycle = "2.10.0"
sqlite = "2.7.1"
angusMail = "2.0.5"
jakartaMail = "2.1.5"
angusActivation = "2.0.3"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
greenmail = "2.1.15"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# 别名用 roborazzi-android 是为了避开与 roborazzi-compose 的 accessor 冲突；artifact 名仍是 roborazzi
roborazzi-android = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
# retrofit-core / okhttp-core 是为了避开与 retrofit-kotlinx-serialization / okhttp-mockwebserver 的 accessor 冲突
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# :core 的同步协调器用协程做并发控制（Semaphore / Mutex）；:app 那边已经有 coroutines-android，
# 版本同源，不会引入第二套协程运行时。
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# 测试用的本地 IMAP 服务器（自签名证书的 IMAPS），只能在桌面 JVM 上跑，测试标 @Category(JvmOnly)。
greenmail = { group = "com.icegreen", name = "greenmail", version.ref = "greenmail" }
# KMP 制品：:core（纯 Kotlin/JVM）里解析到 -jvm 变体，App 里解析到 -android 变体。
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
# 邮件解析（Jakarta Mail 的 Eclipse 实现）与它配套的 API、Activation 实现。
angus-mail = { group = "org.eclipse.angus", name = "angus-mail", version.ref = "angusMail" }
jakarta-mail-api = { group = "jakarta.mail", name = "jakarta.mail-api", version.ref = "jakartaMail" }
angus-activation = { group = "org.eclipse.angus", name = "angus-activation", version.ref = "angusActivation" }
# 在设备上跑 :core 测试用的 instrumented 运行时（runner 提供 AndroidJUnitRunner，ext-junit 提供 AndroidJUnit4）。
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 只用于把 KGP 版本拉到与 compose 插件一致；AGP 9.0 的内置 Kotlin 不要求在模块里 apply 它
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# :core 是纯 Kotlin/JVM 模块（不依赖 Android），用 KGP 的 JVM 插件和目录里的 kotlin 版本。
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
