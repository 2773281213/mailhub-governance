[versions]
# 版本依据（2026-10 查证）：
# - AGP：developer.android.com/build/releases/past-releases/agp-9-0-0-release-notes 的兼容表
#   写明 AGP 9.0 最低 Gradle 9.1.0；AGP 9.1 要求 Gradle 9.3.1、9.2 要求 9.4.1、
#   9.3 要求 9.5.0、9.4 要求 9.6.0。本项目固定 Gradle 9.1.0，所以取兼容的最新稳定版 9.0.1。
# - Kotlin：Maven Central 的 kotlin-gradle-plugin maven-metadata 里最新的稳定 2.x（无 -RC/-Beta）。
# - Compose BOM / core-ktx / activity-compose：最新稳定版（BOM 2026.09.00、core-ktx 1.19.1、
#   activity-compose 1.13.0）的 AAR 元数据要求 compileSdk 37 和 AGP 9.1.0，与本卡固定的
#   compileSdk 36 + Gradle 9.1.0 冲突，所以取仍支持 compileSdk 36 的最新稳定版：
#   BOM 2026.06.01（compose.ui 1.11.4，minCompileSdk=35）、core-ktx 1.18.0（minCompileSdk=36）、
#   activity-compose 1.12.4（minCompileSdk=36）。
# - Robolectric 4.17：Maven Central maven-metadata 里的最新稳定版；4.17 的 release notes 明确
#   支持 SDK 36（"Run preinstrumented with SDK 36 on CI"），pom 只依赖 androidx.test:monitor:1.8.0
#   （该 AAR 没有 aar-metadata.properties，不限制 compileSdk）。
# - Roborazzi 1.77.0：Maven Central maven-metadata 里的最新稳定版；roborazzi 和 roborazzi-compose
#   两个 AAR 的 META-INF/com/android/build/gradle/aar-metadata.properties 都是
#   minCompileSdk=1、minAndroidGradlePluginVersion=1.0.0，对 compileSdk 36 / AGP 9.0.1 没有限制。
# - T08 网络层（Maven Central 最新稳定版，2026-10 查证）：
#   retrofit 3.0.0 / converter-kotlinx-serialization 3.0.0、okhttp 5.4.0 / mockwebserver 5.4.0、
#   kotlinx-serialization-json 1.12.0、kotlinx-coroutines 1.11.0。
#   retrofit 是 jar，依赖 okhttp 4.12.0，这里显式升到 5.x（okhttp 5 与 retrofit 3 兼容）。
#   okhttp 最新稳定版是 5.5.1，但它的 okhttp-android AAR 要求 compileSdk 37，所以退到 5.4.0
#   （okhttp-android 5.4.0 的 aar-metadata 是 minCompileSdk=36）。mockwebserver 与 okhttp 同版本。
#   mockwebserver 5.4.0 依赖 mockwebserver3，测试里直接用 mockwebserver3 API。
# - datastore-preferences 1.3.0（AAR 没有 aar-metadata.properties，不限制 compileSdk）。
# - lifecycle 最新稳定版是 2.11.0，但 lifecycle-runtime-compose-android / lifecycle-viewmodel-compose-android
#   2.11.0 的 aar-metadata 要求 compileSdk 37 + AGP 9.1.0，所以退到 2.10.0（minCompileSdk=35、
#   minAndroidGradlePluginVersion=8.6.0）。
agp = "9.0.1"
kotlin = "2.4.21"
composeBom = "2026.06.01"
activityCompose = "1.12.4"
coreKtx = "1.18.0"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.77.0"
retrofit = "3.0.0"
okhttp = "5.4.0"
kotlinxSerialization = "1.12.0"
kotlinxCoroutines = "1.11.0"
datastore = "1.3.0"
lifecycle = "2.10.0"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# 别名用 roborazzi-android 是为了避开与 roborazzi-compose 的 accessor 冲突；artifact 名仍是 roborazzi
roborazzi-android = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
# retrofit-core / okhttp-core 是为了避开与 retrofit-kotlinx-serialization / okhttp-mockwebserver 的 accessor 冲突
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 只用于把 KGP 版本拉到与 compose 插件一致；AGP 9.0 的内置 Kotlin 不要求在模块里 apply 它
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
